[project]
name = "folego"
version = "0.1.0"
description = "Observatório aberto de fumaça de queimadas e internações no SUS"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "civisbr"}]
dependencies = [
    "duckdb>=1.2,<2",
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "patsy>=1,<2",
    "polars>=1.30,<3",
    "pyarrow>=19,<24",
    "scipy>=1.15,<2",
    "shapely>=2,<3",
    "statsmodels>=0.14,<0.16",
]

[project.optional-dependencies]
climate = ["cdsapi>=0.7,<1", "xarray>=2025.1", "netcdf4>=1.7", "rioxarray>=0.18"]
sih = ["pysus>=0.15", "dbfread>=2.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
folego = "folego.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
