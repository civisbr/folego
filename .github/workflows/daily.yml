name: Daily data audit and research forecast
on:
  schedule:
    - cron: '20 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-data
  cancel-in-progress: false
jobs:
  territory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - run: uv sync --frozen
      - run: uv run folego audit-territory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: territory-coverage
          path: |
            data/marts/territory-audit.json
            data/staging/territory-coverage.json
          retention-days: 30
  research:
    if: vars.FOLEGO_HISTORY_URL != '' && vars.FOLEGO_FUTURE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - run: uv sync --frozen
      - name: Download prepared aggregate panels
        env:
          HISTORY_URL: ${{ vars.FOLEGO_HISTORY_URL }}
          FUTURE_URL: ${{ vars.FOLEGO_FUTURE_URL }}
        run: |
          mkdir -p data/staging
          curl --fail --location --proto '=https' --max-time 120 "$HISTORY_URL" -o data/staging/history.parquet
          curl --fail --location --proto '=https' --max-time 120 "$FUTURE_URL" -o data/staging/future.parquet
      - name: Generate explicitly unvalidated research forecast
        run: |
          uv run folego forecast --history data/staging/history.parquet \
            --future data/staging/future.parquet --issued-on "$(date -u +%F)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-forecast-unvalidated
          path: data/marts/research-forecast.json
          retention-days: 7
